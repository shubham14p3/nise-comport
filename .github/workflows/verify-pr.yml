name: Validate Nise Comport PR

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Encrypted API transport security and recovery script syntax
        run: npm run security:check && node --check scripts/job-ids-doctor.mjs && node --check scripts/job-ids-repair.mjs && node --check scripts/counter-comments-repair.mjs && node --check scripts/migrations-doctor.mjs
      - name: Unit and integration-style tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
