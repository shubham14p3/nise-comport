name: Validate Nise Comport PR

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and integration-style tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
