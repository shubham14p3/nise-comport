name: verify
on:
  push:
    branches: ["ci/verify"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: nise }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run checks
        shell: bash
        run: |
          set +e
          mkdir -p out
          node scripts/generate-api-transport-key.mjs | grep '=' > keys.txt
          {
            echo "DATABASE_URL=postgres://postgres:ci@localhost:5432/nise"
            echo "DATABASE_SSL=false"
            echo "NEXT_PUBLIC_SITE_URL=https://www.nisecomport.com"
            echo "OTP_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            echo "PAN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "RECORDS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "PRIVATE_UPLOAD_DIR=/tmp/uploads"
            cat keys.txt
          } > .env.local
          run() { echo "=== $1"; shift; "$@" > out/step.log 2>&1; code=$?; tail -c 60000 out/step.log; echo "=== exit $code"; }
          {
            run "npm ci" npm ci --no-audit --no-fund
            run "db:migrate" npx drizzle-kit migrate
            run "security:check" npm run security:check
            run "test" npm test
            run "lint" npm run lint
            run "tsc" npx tsc --noEmit -p tsconfig.json
            run "data:check" npm run data:check
            echo "=== dev first (like your machine: dev files exist before build)"
            (npx next dev -p 3300 > out/dev0.log 2>&1 &) ; sleep 10
            for u in / /services /insurance /services/pan-card; do curl -s -m 120 -o /dev/null -w '%{http_code} ' "http://localhost:3300$u"; done; echo
            # corrupt the dev route types the way an interrupted dev server can
            pkill -f "next dev" ; sleep 2; f=.next/dev/types/routes.d.ts; ls -la .next/dev/types || true
            [ -f $f ] && head -c 3000 $f > /tmp/r && tail -c 1500 $f >> /tmp/r && cp /tmp/r $f
            run "build" npm run build
            echo "=== pages (next start)"
            (npx next start -p 3100 > out/start.log 2>&1 &) ; sleep 8
            for u in / /services /services/car-insurance /services/health-life-insurance /services/lic-policy /services/pan-card /services/voter-id /services/abua-awas-yojana /services/ration-card /services/ayushman-card /hi/services/pan-card /pan/request "/request?service=voter-id" "/request?service=voter-id-services-jamshedpur" /insurance /services/insurance /services/car-insurance-jamshedpur /hi/services/pan-card-jamshedpur; do echo "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3100$u") $u"; done
            echo "--- titles"; for u in / /services/pan-card /insurance /hi; do curl -s "http://localhost:3100$u" | grep -o '<title>[^<]*</title>'; done
            tail -c 20000 out/start.log
            pkill -f "next start" ; sleep 2
            echo "=== pages (next dev)"
            (npx next dev -p 3200 > out/dev.log 2>&1 &) ; sleep 10
            for u in /services/car-insurance /services/pan-card /services/voter-id /pan/request "/request?service=voter-id-services-jamshedpur" /insurance; do echo "$(curl -s -m 120 -o /dev/null -w '%{http_code}' "http://localhost:3200$u") $u"; done
            for u in / /services /gallery /offers /contact /about /faq /blog /pan /print /login /signup /profile /admin /hi /bn /hi/services/pan-card /bn/services/voter-id /services/insurance /services/bike-insurance /services/ration-card /areas-we-serve /team /privacy /terms /sitemap.xml /robots.txt /llms.txt; do echo "$(curl -s -m 120 -o /dev/null -w '%{http_code}' "http://localhost:3200$u") $u"; done
            echo "--- dev log errors/warnings"; grep -iE "error|warn|⨯|failed" out/dev.log | grep -v "DeprecationWarning" | sort | uniq -c | head -60
            tail -c 6000 out/dev.log
          } > out/result.log 2>&1
          grep '^=== ' out/result.log
      - name: Save log
        if: always()
        shell: bash
        run: |
          cp out/result.log /tmp/result.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci/verify-log
          git rm -rfq .
          cp /tmp/result.log result.log
          git add result.log && git commit -qm "verify log $GITHUB_SHA"
          git push -f origin ci/verify-log
